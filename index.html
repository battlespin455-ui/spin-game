<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin The Bottle Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            /* Taxta masa arxa fonu */
            background-color: #b5651d;
            background-image: radial-gradient(circle, #c8752c 0%, #8b4513 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* Yuxarı Panel */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            color: white;
        }
        .hearts {
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .table-info {
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
        }
        /* Oyun Masası Mərkəzi */
        .game-table {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Fırlanan Şüşə */
        .bottle-container {
            position: absolute;
            width: 100px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 3s ease-out;
        }
        .bottle {
            width: 50px;
            height: 140px;
            background: #2e8b57; /* Şüşə rəngi */
            border-radius: 25px 25px 10px 10px;
            position: relative;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.5);
        }
        .bottle::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 15px;
            width: 20px;
            height: 25px;
            background: #2e8b57;
            border-radius: 4px;
        }
        /* Oyunçu Avatarları (Masanın ətrafında) */
        .player {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #gold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .player img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Avatarların mövqeləri (Dairəvi düzülüş) */
        .p1 { top: 10%; left: 20%; }
        .p2 { top: 10%; right: 20%; }
        .p3 { top: 50%; left: 5%; transform: translateY(-50%); }
        .p4 { top: 50%; right: 5%; transform: translateY(-50%); }
        .p5 { bottom: 15%; left: 25%; }
        .p6 { bottom: 15%; right: 25%; }

        /* Aşağı Panel */
        .bottom-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
        }
        .btn {
            background: #ffcc00;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Yuxarı Panel -->
    <div class="top-bar">
        <div class="hearts">❤️ 7</div>
        <div class="table-info">Masa 51</div>
    </div>

    <!-- Oyun Sahəsi -->
    <div class="game-table">
        <!-- Oyunçu Avatarları -->
        <div class="player p1"><img src="[https://via.placeholder.com/60](https://via.placeholder.com/60)" alt="P1"></div>
        <div class="player p2"><img src="[https://via.placeholder.com/60](https://via.placeholder.com/60)" alt="P2"></div>
        <div class="player p3"><img src="[https://via.placeholder.com/60](https://via.placeholder.com/60)" alt="P3"></div>
        <div class="player p4"><img src="[https://via.placeholder.com/60](https://via.placeholder.com/60)" alt="P4"></div>
        <div class="player p5"><img src="[https://via.placeholder.com/60](https://via.placeholder.com/60)" alt="P5"></div>
        <div class="player p6"><img src="[https://via.placeholder.com/60](https://via.placeholder.com/60)" alt="P6"></div>

        <!-- Fırlanan Şüşə Mərkəzdə -->
        <div class="bottle-container" id="bottleContainer" onclick="spinBottle()">
            <div class="bottle"></div>
        </div>
    </div>

    <!-- Aşağı Panel -->
    <div class="bottom-bar">
        <button class="btn">Hədiyyələr</button>
        <button class="btn">Musiqi</button>
        <button class="btn">Söhbət</button>
    </div>

    <script>
        function spinBottle() {
            const bottle = document.getElementById('bottleContainer');
            // Təsadüfi fırlanma dərəcəsi təyin edirik (məsələn: 3-5 tam dövr + random)
            const randomDegree = Math.floor(Math.random() * 3600) + 720;
            bottle.style.transform = `rotate(${randomDegree}deg)`;
        }
    </script>

</body>
</html>
